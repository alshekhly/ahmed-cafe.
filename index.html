/* Layout: app-style ordering menu. Header with logo mark, language switch and open status; blue offer banner; table-service card; sticky search and category chips; white item cards with tinted picture tiles; bottom cart bar; option and order sheets. Blue on white, light and dark both designed. */
:root {
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-2: #eaf0fa;
  --fg: #0f1b33;
  --muted: #55637d;
  --line: #dde5f2;
  --brand: #1f5fd6;
  --brand-hi: #1747a8;
  --on-brand: #ffffff;
  --brand-soft: #e3edfd;
  --brand-ink: #1a52bd;
  --ok: #178a4a;
  --warn: #a8480a;
  --ink: #0f1b33;
  --font: "Cairo", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1224;
    --surface: #121c33;
    --surface-2: #1b2845;
    --fg: #eef3fc;
    --muted: #a9b6cf;
    --line: #25344f;
    --brand: #2f6be0;
    --brand-hi: #2557bd;
    --brand-soft: #17284a;
    --brand-ink: #8db5ff;
    --ok: #5fd28c;
    --warn: #f0a15e;
    --ink: #eef3fc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1224;
  --surface: #121c33;
  --surface-2: #1b2845;
  --fg: #eef3fc;
  --muted: #a9b6cf;
  --line: #25344f;
  --brand: #2f6be0;
  --brand-hi: #2557bd;
  --brand-soft: #17284a;
  --brand-ink: #8db5ff;
  --ok: #5fd28c;
  --warn: #f0a15e;
  --ink: #eef3fc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 0 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
button, input { font-family: var(--font); }
.wrap { max-width: 560px; margin: 0 auto; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Header */
.head { display: flex; align-items: center; gap: 12px; padding-block: 20px 6px; }
.logo {
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: var(--brand);
}
.logo svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brandtext { flex: 1; min-width: 0; }
.brandtext h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.2; }
.brandtext p { margin: 0; font-size: 15px; color: var(--muted); }
.lang {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 2px 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
}
.lang:hover, .lang:focus-visible { border-color: var(--brand-ink); outline: none; }

.status { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--warn); }

/* Offer banner */
.offer {
  margin-top: 16px;
  padding: 20px;
  border-radius: 22px;
  color: var(--on-brand);
  background:
    radial-gradient(circle at 100% 0%, rgba(255,255,255,.14) 0 70px, transparent 71px),
    radial-gradient(circle at 0% 110%, rgba(255,255,255,.10) 0 90px, transparent 91px),
    linear-gradient(135deg, var(--brand), var(--brand-hi));
}
.offer .tagpill { display: inline-block; font-size: 13px; font-weight: 700; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.2); }
.offer h2 { margin: 8px 0 2px; font-size: 24px; font-weight: 800; line-height: 1.3; }
.offer .pr { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
.offer .pr b { font-size: 28px; font-weight: 800; }
.offer .pr s { opacity: .75; font-size: 17px; }
.offer .pr span { font-size: 14px; opacity: .85; }
.btn-light {
  margin-top: 12px;
  min-height: 44px;
  padding: 4px 24px;
  font-size: 16px;
  font-weight: 700;
  color: var(--brand-hi);
  background: #fff;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
}
.btn-light:hover, .btn-light:focus-visible { background: var(--brand-soft); outline: 3px solid rgba(255,255,255,.5); outline-offset: 2px; }

/* Table service */
.svc { margin-top: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
.svc h3 { margin: 0; font-size: 19px; font-weight: 800; }
.svc p { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
.svc-row { display: flex; gap: 8px; flex-wrap: wrap; }
.svc-row .tbl { flex: 1 1 100%; }
.svc-btn {
  flex: 1 1 130px;
  min-height: 46px;
  padding: 4px 14px;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border: 0;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.svc-btn:hover, .svc-btn:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 1px; }
.svc-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.svc .hint { min-height: 22px; margin: 8px 0 0; font-size: 14.5px; font-weight: 600; color: var(--warn); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 15px; color: var(--muted); font-weight: 500; }
.field input {
  font-size: 18px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 14px;
  min-height: 48px;
  width: 100%;
}
.field input:focus-visible, .search input:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 1px; }

/* Sticky controls */
.controls {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  margin-top: 8px;
  padding-block: 12px 10px;
  background: var(--bg);
}
.search { position: relative; }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search input {
  width: 100%;
  min-height: 50px;
  padding: 8px 16px;
  padding-inline-start: 44px;
  font-size: 17px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
.chip {
  flex: 0 0 auto;
  min-height: 42px;
  padding: 2px 20px;
  font-size: 16px;
  font-weight: 700;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover, .chip:focus-visible { border-color: var(--brand-ink); outline: none; }
.chip[aria-pressed="true"] { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }

/* Items */
section.cat { padding-top: 22px; }
section.cat h2 { margin: 0 0 12px; font-size: 26px; font-weight: 800; line-height: 1.3; display: flex; align-items: center; gap: 10px; }
section.cat h2 small { font-size: 14px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 0 12px; border-radius: 999px; }
.items { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.card { position: relative; display: flex; gap: 14px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.card.sold { opacity: .6; }
.pic {
  flex: 0 0 auto;
  width: 88px;
  height: 88px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--surface-2);
  background: color-mix(in srgb, var(--tint, #888) 26%, var(--surface));
}
.pic svg { width: 62px; height: 62px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.t { fill: var(--tint); fill-opacity: .95; }
.f { fill: var(--foam, #f3ead6); }
.g { fill: var(--ink); stroke: none; }
.body { flex: 1; min-width: 0; }
.nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nm b { font-size: 19px; font-weight: 700; line-height: 1.35; }
.badge { font-size: 12.5px; font-weight: 700; padding: 0 10px; border-radius: 999px; color: var(--brand-ink); background: var(--brand-soft); }
.badge.out { color: var(--warn); background: var(--surface-2); }
.ds { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.5; }
.foot { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.price { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 19px; color: var(--brand-ink); white-space: nowrap; }
.price span { font-size: 13px; font-weight: 600; margin-inline-start: 4px; opacity: .85; }
.act { display: flex; align-items: center; gap: 8px; }
.inbag { font-size: 14px; font-weight: 700; color: var(--ok); font-variant-numeric: tabular-nums; }
.add {
  min-height: 42px;
  padding: 2px 22px;
  font-size: 16px;
  font-weight: 700;
  color: var(--on-brand);
  background: var(--brand);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
}
.add:hover, .add:focus-visible { background: var(--brand-hi); outline: 3px solid var(--brand-soft); outline-offset: 1px; }
.add[disabled] { background: var(--surface-2); color: var(--muted); cursor: not-allowed; outline: none; }
.empty { margin: 30px 0; text-align: center; color: var(--muted); font-size: 17px; }

/* Footer */
footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; color: var(--muted); font-size: 15.5px; }
footer b { display: block; font-size: 22px; font-weight: 800; color: var(--fg); }
.links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.lnk { min-height: 42px; padding: 4px 18px; display: inline-flex; align-items: center; font-size: 15.5px; font-weight: 700; color: var(--brand-ink); background: var(--brand-soft); border-radius: 999px; text-decoration: none; }
.lnk:hover, .lnk:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 1px; }

/* Cart bar */
.bar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 20;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--brand);
  color: var(--on-brand);
  border-radius: 24px 24px 0 0;
}
.bar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar-sum { flex: 1; min-width: 0; font-size: 15.5px; opacity: .95; }
.bar-sum b { display: block; font-size: 22px; line-height: 1.3; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Buttons shared */
.primary {
  min-height: 50px;
  padding: 6px 26px;
  font-size: 17px;
  font-weight: 700;
  color: var(--brand-hi);
  background: #fff;
  border: 0;
  border-radius: 999px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.primary:hover, .primary:focus-visible { background: var(--brand-soft); outline: 3px solid rgba(255,255,255,.5); outline-offset: 2px; }
.solid { color: var(--on-brand); background: var(--brand); }
.solid:hover, .solid:focus-visible { background: var(--brand-hi); outline: 3px solid var(--brand-soft); outline-offset: 1px; }
.solid[aria-disabled="true"], .solid[disabled] { opacity: .45; cursor: not-allowed; }
.ghost { min-height: 44px; padding: 2px 18px; font-size: 15px; font-weight: 600; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.ghost:hover, .ghost:focus-visible { border-color: var(--brand-ink); outline: none; }

/* Sheets */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(4,8,18,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--surface);
  color: var(--fg);
  border-radius: 28px 28px 0 0;
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet h3 { margin: 0 0 10px; font-size: 25px; font-weight: 800; line-height: 1.3; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.grp { margin-bottom: 14px; }
.grp > span { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 700; color: var(--muted); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 44px; padding: 2px 18px; font-size: 16px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.pill[aria-pressed="true"] { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }
.pill:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 1px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.qty button { width: 48px; height: 44px; font-size: 22px; line-height: 1; color: var(--brand-ink); background: transparent; border: 0; cursor: pointer; }
.qty button:hover, .qty button:focus-visible { background: var(--brand-soft); outline: none; }
.qty b { min-width: 40px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0 0 14px; padding: 0; }
.lines li { display: flex; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.lines .ln { flex: 1; min-width: 0; font-weight: 700; font-size: 17.5px; line-height: 1.4; }
.lines .ln small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
.lines .lp { min-width: 70px; text-align: end; color: var(--brand-ink); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .qty button { width: 40px; height: 38px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; padding-block: 12px 8px; }
.total b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hint { min-height: 24px; margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--warn); }
.actions { display: flex; gap: 10px; }
.actions .primary { flex: 1; }
.note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
</style>

      if (show) visible++;
    });
    document.querySelectorAll("section.cat").forEach(function (sec) {
      var any = sec.querySelector(".card:not([hidden])");
      sec.hidden = !any;
    });
    var empty = $("empty");
    if (empty) empty.hidden = visible > 0;
  }

  // ---- Cart bar, badges, service links ----
  function updateBadges() {
    document.querySelectorAll("[data-bag]").forEach(function (s) {
      var q = qtyOf(s.getAttribute("data-bag"));
      s.textContent = q > 0 ? "× " + q + " " + tr("inBag") : "";
    });
  }
  function updateBar() {
    var t = totals();
    $("bar").hidden = t.count === 0;
    $("barCount").textContent = t.count + " " + (t.count === 1 ? tr("item") : tr("items"));
    $("barTotal").textContent = fmt(t.total) + " " + tr("cur");
    if (t.count === 0) $("cartOverlay").hidden = true;
  }
  function updateService() {
    var call = $("svcCall"), bill = $("svcBill");
    if (!call) return;
    var has = table.trim().length > 0;
    [call, bill].forEach(function (a) { a.setAttribute("aria-disabled", has ? "false" : "true"); });
    call.href = has ? waLink("طاولة " + table.trim() + ": يطلبون الكابتن") : "#";
    bill.href = has ? waLink("طاولة " + table.trim() + ": يطلبون الحساب") : "#";
  }
  function setTable(v) {
    table = v;
    LS.set("cafe-table", v);
    var a = $("tableSvc"), b = $("tableCart");
    if (a && a.value !== v) a.value = v;
    if (b && b.value !== v) b.value = v;
    updateService();
    updateCartLink();
  }

  // ---- Option sheet ----
  function openOptions(id) {
    var it = byId[id];
    var o = optList(it);
    if (!o) { addLine(id, null, [], 1); afterCartChange(); return; }
    opt = { id: id, size: o.sizes ? o.sizes[0].id : null, extras: [], qty: 1 };
    renderOptions();
    $("optOverlay").hidden = false;
  }
  function optPrice() {
    return unitPrice({ id: opt.id, size: opt.size, extras: opt.extras }) * opt.qty;
  }
  function renderOptions() {
    var it = byId[opt.id];
    var o = optList(it);
    var h = '<h3><span>' + esc(nameOf(it)) + '</span><button type="button" class="ghost" data-act="optClose">' + esc(tr("close")) + '</button></h3>';
    if (o.sizes) {
      h += '<div class="grp"><span>' + esc(tr("size")) + '</span><div class="pills">';
      o.sizes.forEach(function (s) {
        h += '<button type="button" class="pill" data-act="optSize" data-v="' + s.id + '" aria-pressed="' + (opt.size === s.id) + '">' +
          esc(s[lang]) + (s.p ? " +" + fmt(s.p) : "") + '</button>';
      });
      h += '</div></div>';
    }
    if (o.extras) {
      h += '<div class="grp"><span>' + esc(tr("extras")) + '</span><div class="pills">';
      o.extras.forEach(function (x) {
        h += '<button type="button" class="pill" data-act="optExtra" data-v="' + x.id + '" aria-pressed="' + (opt.extras.indexOf(x.id) !== -1) + '">' +
          esc(x[lang]) + (x.p ? " +" + fmt(x.p) : "") + '</button>';
      });
      h += '</div></div>';
    }
    h += '<div class="grp"><span>' + esc(tr("qty")) + '</span><div class="qty">' +
      '<button type="button" data-act="optDec" aria-label="' + esc(tr("dec")) + '">−</button><b>' + opt.qty + '</b>' +
      '<button type="button" data-act="optInc" aria-label="' + esc(tr("inc")) + '">+</button></div></div>';
    h += '<button type="button" class="primary solid" style="width:100%" data-act="optAdd">' + esc(tr("addFor")) + ' · ' + fmt(optPrice()) + ' ' + esc(tr("cur")) + '</button>';
    $("optSheet").innerHTML = h;
  }

  // ---- Order sheet ----
  function cartMessage() {
    var t = totals();
    var note = ($("note") ? $("note").value.trim() : "");
    var lines = ["طلب جديد", "طاولة: " + table.trim(), ""];
    cart.forEach(function (l) {
      var labels = optLabels(l, "ar");
      lines.push("• " + l.qty + " × " + nameOf(byId[l.id], "ar") + (labels.length ? " (" + labels.join("، ") + ")" : "") + " — " + fmt(l.qty * unitPrice(l)));
    });
    lines.push("", "المجموع: " + fmt(t.total) + " د.ع");
    if (note) lines.push("ملاحظة: " + note);
    return lines.join("\n");
  }
  function renderCart() {
    var t = totals();
    var h = '<h3><span>' + esc(tr("yourOrder")) + '</span><button type="button" class="ghost" data-act="cartClose">' + esc(tr("close")) + '</button></h3><ul class="lines">';
    cart.forEach(function (l, i) {
      var it = byId[l.id];
      var labels = optLabels(l, lang);
      h += '<li><div class="ln">' + esc(nameOf(it)) + (labels.length ? '<small>' + esc(labels.join(" · ")) + '</small>' : "") + '</div>' +
        '<div class="qty"><button type="button" data-act="ldec" data-i="' + i + '" aria-label="' + esc(tr("dec")) + '">−</button><b>' + l.qty + '</b>' +
        '<button type="button" data-act="linc" data-i="' + i + '" aria-label="' + esc(tr("inc")) + '">+</button></div>' +
        '<div class="lp">' + fmt(l.qty * unitPrice(l)) + '</div></li>';
    });
    h += '</ul><div class="field" style="margin-bottom:12px"><label for="tableCart">' + esc(tr("tableLbl")) + '</label>' +
      '<input id="tableCart" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="' + esc(tr("tablePh")) + '" value="' + esc(table) + '"></div>' +
      '<div class="field" style="margin-bottom:6px"><label for="note">' + esc(tr("note")) + '</label>' +
      '<input id="note" type="text" autocomplete="off" maxlength="80" placeholder="' + esc(tr("notePh")) + '" value="' + esc(noteValue) + '"></div>' +
      '<div class="total"><span>' + esc(tr("total")) + '</span><b>' + fmt(t.total) + ' ' + esc(tr("cur")) + '</b></div>' +
      '<p class="hint" id="cartHint"></p>' +
      '<div class="actions"><a class="primary solid" id="sendOrder" href="#" target="_blank" rel="noopener" aria-disabled="true">' + esc(tr("send")) + '</a>' +
      '<button type="button" class="ghost" data-act="clear">' + esc(tr("clear")) + '</button></div>' +
      '<p class="note">' + esc(tr("waNote")) + '</p>';
    $("cartSheet").innerHTML = h;
    updateCartLink();
  }
  var noteValue = "";
  function updateCartLink() {
    var a = $("sendOrder");
    if (!a) return;
    var ok = totals().count > 0 && table.trim().length > 0;
    a.setAttribute("aria-disabled", ok ? "false" : "true");
    a.href = ok ? waLink(cartMessage()) : "#";
  }

  function afterCartChange() {
    updateBadges();
    updateBar();
    if (!$("cartOverlay").hidden) renderCart();
  }

  // ---- Events ----
  document.addEventListener("click", function (e) {
    var svc = e.target.closest("[data-svc]");
    if (svc && svc.getAttribute("aria-disabled") === "true") {
      e.preventDefault();
      $("svcHint").textContent = tr("needTable");
      $("tableSvc").focus();
      return;
    }
    var send = e.target.closest("#sendOrder");
    if (send && send.getAttribute("aria-disabled") === "true") {
      e.preventDefault();
      $("cartHint").textContent = totals().count === 0 ? tr("needItem") : tr("needTable");
      $("tableCart").focus();
      return;
    }
    if (e.target === $("optOverlay")) { $("optOverlay").hidden = true; return; }
    if (e.target === $("cartOverlay")) { $("cartOverlay").hidden = true; return; }

    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");
    var i = parseInt(b.getAttribute("data-i"), 10);
    var v = b.getAttribute("data-v");

    if (act === "lang") { lang = lang === "ar" ? "en" : "ar"; LS.set("cafe-lang", lang); renderApp(); if (!$("cartOverlay").hidden) renderCart(); }
    else if (act === "chip") { catFilter = b.getAttribute("data-cat"); document.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c.getAttribute("data-cat") === catFilter); }); applyFilter(); }
    else if (act === "offer") { addLine("offer", null, [], 1); afterCartChange(); }
    else if (act === "add") { openOptions(id); }
    else if (act === "optClose") { $("optOverlay").hidden = true; }
    else if (act === "optSize") { opt.size = v; renderOptions(); }
    else if (act === "optExtra") { var k = opt.extras.indexOf(v); if (k === -1) opt.extras.push(v); else opt.extras.splice(k, 1); renderOptions(); }
    else if (act === "optDec") { opt.qty = Math.max(1, opt.qty - 1); renderOptions(); }
    else if (act === "optInc") { opt.qty = Math.min(20, opt.qty + 1); renderOptions(); }
    else if (act === "optAdd") { addLine(opt.id, opt.size, opt.extras, opt.qty); $("optOverlay").hidden = true; afterCartChange(); }
    else if (act === "cartClose") { $("cartOverlay").hidden = true; }
    else if (act === "linc") { cart[i].qty = Math.min(50, cart[i].qty + 1); afterCartChange(); }
    else if (act === "ldec") { cart[i].qty -= 1; if (cart[i].qty <= 0) cart.splice(i, 1); afterCartChange(); }
    else if (act === "clear") { cart = []; afterCartChange(); }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "q") { query = t.value; applyFilter(); }
    else if (t.id === "tableSvc" || t.id === "tableCart") { setTable(t.value); var h = $("svcHint"); if (h && t.value.trim()) h.textContent = ""; }
    else if (t.id === "note") { noteValue = t.value; updateCartLink(); }
  });

  $("openCart").addEventListener("click", function () { renderCart(); $("cartOverlay").hidden = false; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { $("optOverlay").hidden = true; $("cartOverlay").hidden = true; }
  });

  renderApp();
})();
</script>

</body></html>
